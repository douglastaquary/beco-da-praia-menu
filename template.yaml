AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Beco da Praia menu orders backend with Quarkus, Lambda, DynamoDB, and AWS IoT Core.

Parameters:
  PrinterOrdersTopic:
    Type: String
    Default: beco/printer/kitchen/orders
  OrdersTableName:
    Type: String
    Default: BecoOrders
  IotDataEndpoint:
    Type: String
    Default: ''
    Description: Optional AWS IoT data endpoint URL, for example https://xxxxxxxxxxxxxx-ats.iot.us-east-1.amazonaws.com.

Globals:
  Function:
    Runtime: java17
    MemorySize: 1024
    Timeout: 20
    Architectures:
      - arm64
    Environment:
      Variables:
        ORDERS_TABLE: !Ref OrdersTable
        PRINTER_ORDERS_TOPIC: !Ref PrinterOrdersTopic
        IOT_DATA_ENDPOINT: !Ref IotDataEndpoint

Resources:
  OrdersApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/target/function.zip
      Handler: io.quarkus.amazon.lambda.http.LambdaHttpHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - Statement:
            Effect: Allow
            Action:
              - iot:Publish
            Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/${PrinterOrdersTopic}
      Events:
        CreateOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrdersApi
            Path: /orders
            Method: POST
        GetOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrdersApi
            Path: /orders/{orderId}
            Method: GET
        ReprintOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrdersApi
            Path: /orders/{orderId}/reprint
            Method: POST
        PrintStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrdersApi
            Path: /orders/{orderId}/print-status
            Method: POST

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref OrdersTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

Outputs:
  OrdersApiUrl:
    Description: Public URL for the orders API.
    Value: !Sub https://${OrdersApi}.execute-api.${AWS::Region}.amazonaws.com
  OrdersTableName:
    Description: DynamoDB table used by the orders backend.
    Value: !Ref OrdersTable
  PrinterOrdersTopic:
    Description: AWS IoT Core topic consumed by the Raspberry Pi printer agent.
    Value: !Ref PrinterOrdersTopic
